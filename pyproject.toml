[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studybuddy-rag"
version = "0.2.0"
description = "Local document Q&A with evaluated dense retrieval and source citations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studybuddy = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
